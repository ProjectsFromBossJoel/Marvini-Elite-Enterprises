<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Agents Ecosystem & Orchestrator</title>
  
  <style>
    /* ==========================================================================
       1. CORE DESIGN TOKENS & NEON THEME
       ========================================================================== */
    :root {
      --bg-gradient: radial-gradient(circle at center, #0b1f3a 0%, #030a16 100%);
      --panel-bg: rgba(7, 20, 40, 0.75);
      --panel-border: rgba(0, 213, 255, 0.3);
      --cyan: #00d5ff;
      --cyan-glow: rgba(0, 213, 255, 0.5);
      --blue-accent: #1e60ff;
      --green: #00ff9d;
      --text-main: #ffffff;
      --text-muted: #8ab4f8;
      --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: var(--bg-page, #eef1f8);
      font-family: var(--font-family);
    }

    .engine-room-panel,
    .engine-room-panel * {
      color: var(--text-main);
    }

    .main.engine-room-main {
      padding-bottom: 22px;
    }

    .engine-room-panel {
      background: var(--bg-gradient);
      border-radius: var(--radius-xl, 26px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 130px);
      box-shadow: var(--shadow-lg, 0 20px 50px rgba(16,24,64,0.12));
    }

    /* ==========================================================================
       2. TOP NAVIGATION HEADER
       ========================================================================== */
    header {
      background: rgba(3, 10, 22, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--panel-border);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: var(--cyan);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px var(--cyan);
      font-weight: bold;
      color: #030a16;
    }

    .brand h1 {
      font-size: 1.15rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .system-stats {
      display: flex;
      gap: 24px;
      font-size: 0.85rem;
    }

    .stat-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
    }

    .stat-badge span {
      color: var(--cyan);
      font-weight: bold;
    }

    /* ==========================================================================
       3. NETWORK CANVAS & ECOSYSTEM CONTAINER
       ========================================================================== */
    .viewport {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas#network-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Node Cards Layer */
    .nodes-layer {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    /* Individual AI Agent Node */
    .agent-node {
      position: absolute;
      width: 110px;
      height: 110px;
      background: var(--panel-bg);
      border: 2px solid var(--panel-border);
      border-radius: 16px;
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
      cursor: pointer;
      transform: translate(-50%, -50%);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .agent-node:hover, .agent-node.active {
      border-color: var(--cyan);
      box-shadow: 0 0 25px var(--cyan-glow);
      transform: translate(-50%, -50%) scale(1.12);
    }

    /* Central Master Hub Node */
    .agent-node.central-hub {
      width: 150px;
      height: 150px;
      border-radius: 20px;
      border-color: var(--cyan);
      background: rgba(0, 213, 255, 0.08);
      box-shadow: 0 0 35px var(--cyan-glow);
      animation: pulse-central 3s infinite alternate;
    }

    @keyframes pulse-central {
      0% { box-shadow: 0 0 25px rgba(0, 213, 255, 0.3); }
      100% { box-shadow: 0 0 45px rgba(0, 213, 255, 0.7); }
    }

    /* Node Image Avatar Frame */
    .node-avatar {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 6px;
    }

    .central-hub .node-avatar {
      width: 70px;
      height: 70px;
    }

    .node-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .node-avatar svg {
      width: 30px;
      height: 30px;
      fill: var(--cyan);
    }

    .node-title {
      font-size: 0.72rem;
      font-weight: 600;
      text-align: center;
      line-height: 1.1;
      color: var(--text-main);
      max-width: 95px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .central-hub .node-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--cyan);
    }

    .node-status-dot {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 8px;
      height: 8px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--green);
    }

    /* ==========================================================================
       4. RIGHT SIDEBAR: AGENT INSPECTOR & IMAGE CHANGER PANEL
       ========================================================================== */
    .inspector-panel {
      position: fixed;
      right: -380px;
      top: 65px;
      width: 360px;
      height: calc(100vh - 80px);
      background: rgba(5, 15, 30, 0.92);
      backdrop-filter: blur(14px);
      border-left: 1px solid var(--panel-border);
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
      z-index: 99;
      transition: right 0.4s ease;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .inspector-panel.open {
      right: 15px;
      border-radius: 16px;
    }

    .inspector-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
    }

    .inspector-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--cyan);
    }

    .btn-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
    }

    /* Avatar Editor Box */
    .avatar-editor-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed var(--panel-border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .editor-avatar-preview {
      width: 80px;
      height: 80px;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid var(--cyan);
      box-shadow: 0 0 15px var(--cyan-glow);
    }

    .editor-avatar-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .editor-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .btn-upload {
      background: var(--blue-accent);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s;
    }

    .btn-upload:hover {
      background: #004bd6;
    }

    .url-input {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--panel-border);
      color: #fff;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-group label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .field-input {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--panel-border);
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .agent-capabilities {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .cap-tag {
      background: rgba(0, 213, 255, 0.1);
      border: 1px solid rgba(0, 213, 255, 0.3);
      color: var(--cyan);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
    }

    /* Action Trigger Button */
    .btn-action {
      background: var(--cyan);
      color: #030a16;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      margin-top: auto;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 0 15px var(--cyan-glow);
    }

    /* Hidden File Input */
    #file-input-hidden {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand">
      <div class="brand-icon">🤖</div>
      <h1>AI AGENT ORCHESTRATOR</h1>
    </div>
    <div class="system-stats">
      <div class="stat-badge">Total Agents: <span id="stat-count">13</span></div>
      <div class="stat-badge">Network Status: <span style="color: var(--green);">ONLINE</span></div>
      <div class="stat-badge">Latency: <span>1.2ms</span></div>
    </div>
  </header>

  <!-- Main Dynamic Viewport -->
  <div class="viewport" id="viewport">
    <canvas id="network-canvas"></canvas>
    <div class="nodes-layer" id="nodes-layer"></div>
  </div>

  <!-- Agent Inspector & Avatar Editor Panel -->
  <div class="inspector-panel" id="inspector-panel">
    <div class="inspector-header">
      <div class="inspector-title" id="insp-title">Agent Details</div>
      <button class="btn-close" id="btn-close-inspector">&times;</button>
    </div>

    <!-- Avatar Image Replacement Box -->
    <div class="avatar-editor-box">
      <div class="editor-avatar-preview" id="insp-avatar-preview">
        <!-- Dynamically rendered -->
      </div>
      <div class="editor-controls">
        <button class="btn-upload" onclick="document.getElementById('file-input-hidden').click()">📷 Upload Custom Image</button>
        <input type="text" id="insp-url-input" class="url-input" placeholder="Or paste Image URL...">
      </div>
      <input type="file" id="file-input-hidden" accept="image/*">
    </div>

    <div class="field-group">
      <label>Agent Name</label>
      <input type="text" id="insp-name-input" class="field-input">
    </div>

    <div class="field-group">
      <label>Specialization & Role</label>
      <input type="text" id="insp-role-input" class="field-input">
    </div>

    <div class="field-group">
      <label>Capabilities</label>
      <div class="agent-capabilities" id="insp-caps"></div>
    </div>

    <button class="btn-action" id="btn-trigger-agent">⚡ Run Agent Task</button>
  </div>

  </div>

  </main>

</div>

    // ==========================================================================
    // SYSTEM INITIALIZATION & RENDERER LOGIC
    // ==========================================================================
    const viewport = document.getElementById('viewport');
    const nodesLayer = document.getElementById('nodes-layer');
    const canvas = document.getElementById('network-canvas');
    const ctx = canvas.getContext('2d');

    const inspectorPanel = document.getElementById('inspector-panel');
    let activeAgentId = null;

    function resizeCanvas() {
      canvas.width = viewport.clientWidth;
      canvas.height = viewport.clientHeight;
    }
    window.addEventListener('resize', () => {
      resizeCanvas();
      positionNodes();
    });
    resizeCanvas();

    // Dynamically calculate radial node positions around the hub
    function positionNodes() {
      const centerX = viewport.clientWidth / 2;
      const centerY = viewport.clientHeight / 2;
      
      const hubAgent = agentsData.find(a => a.isCentral);
      const satelliteAgents = agentsData.filter(a => !a.isCentral);

      // Position Hub
      hubAgent.x = centerX;
      hubAgent.y = centerY;

      // Position Satellite radial orbit
      const radiusX = Math.min(centerX - 90, 420);
      const radiusY = Math.min(centerY - 90, 260);

      satelliteAgents.forEach((agent, index) => {
        const angle = (index / satelliteAgents.length) * Math.PI * 2 - Math.PI / 2;
        agent.x = centerX + Math.cos(angle) * radiusX;
        agent.y = centerY + Math.sin(angle) * radiusY;
      });

      renderNodeElements();
    }

    // Render HTML Node elements for accessibility & hover interactions
    function renderNodeElements() {
      nodesLayer.innerHTML = '';
      
      agentsData.forEach(agent => {
        const el = document.createElement('div');
        el.className = `agent-node ${agent.isCentral ? 'central-hub' : ''} ${agent.id === activeAgentId ? 'active' : ''}`;
        el.style.left = `${agent.x}px`;
        el.style.top = `${agent.y}px`;
        el.dataset.id = agent.id;

        const avatarContent = agent.image 
          ? `<img src="${agent.image}" alt="${agent.name}">`
          : agent.iconSvg;

        el.innerHTML = `
          <div class="node-status-dot"></div>
          <div class="node-avatar">${avatarContent}</div>
          <div class="node-title">${agent.name}</div>
        `;

        el.addEventListener('click', () => openInspector(agent.id));
        nodesLayer.appendChild(el);
      });
    }

    // Canvas Background Renderer (Glow Lines & Energy Pulses)
    let pulseOffset = 0;
    function animateNetwork() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      const hub = agentsData.find(a => a.isCentral);
      const satellites = agentsData.filter(a => !a.isCentral);

      pulseOffset += 0.015;

      satellites.forEach((sat, i) => {
        // Draw Connecting Line
        ctx.beginPath();
        ctx.moveTo(hub.x, hub.y);
        ctx.lineTo(sat.x, sat.y);
        ctx.strokeStyle = 'rgba(0, 213, 255, 0.25)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Draw Flowing Light Pulse along line
        const pulsePos = (pulseOffset + i * 0.1) % 1;
        const px = hub.x + (sat.x - hub.x) * pulsePos;
        const py = hub.y + (sat.y - hub.y) * pulsePos;

        ctx.beginPath();
        ctx.arc(px, py, 3.5, 0, Math.PI * 2);
        ctx.fillStyle = '#00d5ff';
        ctx.shadowColor = '#00d5ff';
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0; // Reset blur
      });

      requestAnimationFrame(animateNetwork);
    }

    // Initialize Positioning and Animation Loop
    positionNodes();
    animateNetwork();

    // ==========================================================================
    // AGENT INSPECTOR & IMAGE CHANGER LOGIC
    // ==========================================================================
    function openInspector(id) {
      activeAgentId = id;
      const agent = agentsData.find(a => a.id === id);

      document.getElementById('insp-title').innerText = agent.isCentral ? 'Master Core Orchestrator' : 'Agent Inspector';
      document.getElementById('insp-name-input').value = agent.name;
      document.getElementById('insp-role-input').value = agent.role;
      document.getElementById('insp-url-input').value = agent.image || '';

      // Render Avatar Preview inside Inspector
      const previewBox = document.getElementById('insp-avatar-preview');
      previewBox.innerHTML = agent.image 
        ? `<img src="${agent.image}" alt="${agent.name}">` 
        : agent.iconSvg;

      // Render Capabilities
      const capsBox = document.getElementById('insp-caps');
      capsBox.innerHTML = agent.caps.map(c => `<span class="cap-tag">${c}</span>`).join('');

      inspectorPanel.classList.add('open');
      renderNodeElements();
    }

    document.getElementById('btn-close-inspector').addEventListener('click', () => {
      inspectorPanel.classList.remove('open');
      activeAgentId = null;
      renderNodeElements();
    });

    // Handle Name & Role Inputs
    document.getElementById('insp-name-input').addEventListener('input', (e) => {
      if (!activeAgentId) return;
      const agent = agentsData.find(a => a.id === activeAgentId);
      agent.name = e.target.value;
      renderNodeElements();
    });

    document.getElementById('insp-role-input').addEventListener('input', (e) => {
      if (!activeAgentId) return;
      const agent = agentsData.find(a => a.id === activeAgentId);
      agent.role = e.target.value;
    });

    // Handle URL Image Input
    document.getElementById('insp-url-input').addEventListener('input', (e) => {
      if (!activeAgentId) return;
      const agent = agentsData.find(a => a.id === activeAgentId);
      agent.image = e.target.value;
      
      const previewBox = document.getElementById('insp-avatar-preview');
      previewBox.innerHTML = agent.image ? `<img src="${agent.image}">` : agent.iconSvg;
      renderNodeElements();
    });

    // Handle Local File Upload for Custom Images
    document.getElementById('file-input-hidden').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file && activeAgentId) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const agent = agentsData.find(a => a.id === activeAgentId);
          agent.image = evt.target.result;
          document.getElementById('insp-url-input').value = '[Uploaded Image File]';
          
          const previewBox = document.getElementById('insp-avatar-preview');
          previewBox.innerHTML = `<img src="${agent.image}">`;
          renderNodeElements();
        };
        reader.readAsDataURL(file);
      }
    });

    // Trigger Task Simulation Button
    document.getElementById('btn-trigger-agent').addEventListener('click', () => {
      if (!activeAgentId) return;
      const agent = agentsData.find(a => a.id === activeAgentId);
      alert(`⚡ Triggered Agent: ${agent.name}\nExecuting task: "${agent.role}"`);
    });
  </script>
</body>
